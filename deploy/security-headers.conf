# Security headers shared by every location block.
#
# This exists as an include rather than a single set of directives in the `server` block
# because of an nginx footgun: an `add_header` anywhere inside a `location` discards ALL
# `add_header` values inherited from the enclosing scope. Any location that sets its own
# header (e.g. Cache-Control) must therefore re-include this file, or it silently serves
# responses with no security headers at all.
#
# `always` makes nginx emit these on error responses too (4xx/5xx) — exactly the pages
# most likely to reflect attacker-influenced content.

# The admin SPA is a self-contained Vite bundle: same-origin scripts and styles, images
# from anywhere (supplier catalog art is remote), API calls to this origin only. The
# bundle uses no inline scripts, so 'unsafe-inline' is deliberately absent from script-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
