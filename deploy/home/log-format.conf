# Access-log format that shows the forwarded-for chain.
#
# Lives at http{} scope (conf.d) because log_format is not valid inside a server block.
# The chain is what determines the correct TRUST_PROXY_HOPS: count the addresses nginx
# received, and the backend must be told to walk back exactly that many plus its own.
log_format sayeh_xff '$remote_addr fwd="$http_x_forwarded_for" "$request" $status';
