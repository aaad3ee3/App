# The body of the Sayeh site: everything below the `listen`/`server_name` lines.
#
# Shared by both deployments — the VPS site (nginx.conf.template, public on :80/:443
# with certbot) and the home-server site (nginx.home.conf.template, bound to localhost
# with Tailscale terminating TLS in front of it). They differ only in how the outside
# world reaches nginx, so keeping the routing in one file means a fix to a location
# block cannot land on one deployment and be forgotten on the other.
#
# Installed to /etc/nginx/snippets/sayeh-locations.conf with __APP_DIR__ substituted.

root __APP_DIR__/admin/dist;
index index.html;

# Nothing this site accepts is large; the API enforces its own 64 KB body limit and
# the admin dashboard only ever POSTs small JSON.
client_max_body_size 256k;

# Don't advertise the exact nginx version in responses.
server_tokens off;

# Compress what this site actually sends. Ubuntu ships `gzip on` but leaves
# `gzip_types` commented out, so the stock default compresses text/html and nothing
# else -- measured on this exact build, a 21 KB catalog response and the 262 KB admin
# bundle both went out uncompressed. That is the whole bandwidth bill, since every
# customer-facing byte here is JSON: the same catalog response compresses 31x (21401
# -> 676 bytes) and the admin bundle 3.3x (262076 -> 80368).
#
# `gzip_proxied any` is the half that is easy to miss: the default is `off`, which
# skips compression for exactly the proxied /api/ responses that matter most.
#
# Product imagery is not served from here at all -- catalog images are supplier CDN
# URLs the app fetches directly -- so there is no already-compressed media to waste
# CPU re-compressing.
gzip_types application/json application/javascript text/css image/svg+xml;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;

# NOTE: every location below re-includes security-headers.conf. That repetition is
# required, not accidental — see the comment at the top of that file.
include /etc/nginx/snippets/sayeh-security-headers.conf;

# Reverse proxy to the backend. Path is passed through unchanged since the backend's
# own routes already live under /api/v1/... (see backend/src/app.ts).
location /api/ {
    include /etc/nginx/snippets/sayeh-security-headers.conf;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The backend trusts a fixed number of hops (TRUST_PROXY_HOPS) and therefore reads
    # that many entries back from the end of X-Forwarded-For. nginx appends the address
    # it saw, so a client cannot forge the address rate limits are keyed on. The count
    # differs per deployment: 1 on the VPS (nginx only), 2 at home (Tailscale, then
    # nginx) — see deploy/home/README.md for how to verify it from the access log.

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}

# Privacy policy and terms. These need stable public URLs because the Google Play and
# App Store listings link to them directly, and a store review fails on a dead link.
location /legal/ {
    include /etc/nginx/snippets/sayeh-security-headers.conf;
    alias __APP_DIR__/legal/;
    try_files $uri $uri/ =404;
}

# Hashed Vite build assets are content-addressed, so they can be cached hard.
location /assets/ {
    include /etc/nginx/snippets/sayeh-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Admin dashboard SPA (client-side routing). index.html itself must never be cached,
# otherwise a deploy leaves browsers pinned to a stale asset manifest.
location / {
    include /etc/nginx/snippets/sayeh-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}

# Version-control and editor droppings should never be reachable if one ever lands in
# the web root.
location ~ /\. {
    deny all;
}
