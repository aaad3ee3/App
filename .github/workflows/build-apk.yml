name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/app-plan-4fv8ik
    paths:
      - ".github/workflows/build-apk.yml"
      - "mobile/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK (split per ABI — the universal APK is too large to hand-deliver)
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: sayeh-app
          path: mobile/build/app/outputs/flutter-apk/*.apk

      # Also publish the arm64 APK (covers the vast majority of real devices, including the
      # tester's own phone) to a dedicated branch so it can be fetched over plain git instead
      # of the Actions artifact API — some networks can reach github.com but not the artifact
      # storage CDN it redirects downloads to. The split build is small enough to hand-deliver
      # directly to the user in chat, unlike the ~57MB universal APK.
      - name: Publish APK to apk-latest branch
        run: |
          mkdir /tmp/apk-branch
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/apk-branch/app-release.apk
          cd /tmp/apk-branch
          git init -q -b apk-latest
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add app-release.apk
          git commit -q -m "APK build from ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin apk-latest
