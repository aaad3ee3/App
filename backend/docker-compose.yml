services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store_dev
    ports:
      - "5432:5432"
    volumes:
      - store_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  store_postgres_data:
